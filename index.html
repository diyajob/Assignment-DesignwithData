<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Web experience - Decide your Destiny </title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

<video autoplay loop muted playsinline class="bg-video">
<source src="video/forestloop.mp4" type="video/mp4">
</video>

<audio id="player" autoplay loop>
<source src="audio/forestsounds.mp3" type="audio/mp3">
</audio>

<audio id="eerie-sfx">
<source src="audio/eeriecreak.mp3" type="audio/mp3">
</audio>

<main class="container" id="main-container">
<section class="center-stage">
<h1 class="title">WELCOME TO YOUR FORTUNE</h1>
<p>shhhh...the woods are listening</p>

<div id="start-box" class="action-box">
<button id="start-btn" class="atmospheric-btn">Let's take a walk through the woods!</button>
</div>

<div id="reveal-box" class="reveal-box">
<p id="message">As you walk down the woods, you begin to hear a creak</p> 
<p class="story-text">The wind shifts reacting to the weather 
and a mysterious door materializes through the whispering trees</p>
<a href="room.html" class="atmospheric-btn" style="text-decoration: none; display: inline-block;">What could it be?</a>
</div>

</section>
</main>

 <script src="script.js"></script>
</body>
</html>
